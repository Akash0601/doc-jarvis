spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docjarvis}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:akash123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    active: local
  autoconfigure:
    exclude:
      - dev.langchain4j.spring.boot.autoconfigure.embedding.model.EmbeddingModelAutoConfiguration
      - dev.langchain4j.spring.boot.autoconfigure.openai.OpenAiAutoConfiguration
      

server:
  port: 8080

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

---
spring:
  config:
    activate:
      on-profile: local

langchain4j:
  qdrant:
    host: localhost
    port: 6334
    uses-tls: false
    collection-name: documents

llm:
  provider: ollama
  ollama:
    base-url: http://localhost:11434
    model-name: llama3.2

---
spring:
  config:
    activate:
      on-profile: prod

langchain4j:
  qdrant:
    host: ${QDRANT_URL}
    port: 6334
    uses-tls: true
    collection-name: documents

llm:
  provider: openai
  openai:
    api-key: ${OPENAI_API_KEY}
    model-name: gpt-4o-mini

qdrant:
  cloud:
    api-key: ${QDRANT_API_KEY}